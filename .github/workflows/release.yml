name: Build and Release

on:
  push:
    tags:
      - 'pysimlin-v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The notebook widget's assets (simlin/_widget/widget.js and the wasm-opt'd
  # libsimlin-browser.wasm) are built ONCE here and every platform wheel
  # ships this one set, byte for byte: cibuildwheel's manylinux containers
  # have no node, and building per platform would let the wheels drift.
  widget-assets:
    name: Build widget assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      # A pinned upstream release, NOT `apt-get install binaryen`: the distro
      # version is older than the flags src/engine/build.sh passes. Shared
      # with wasm-opt.yml and ts-release.yml.
      - name: Install wasm-opt
        run: ./scripts/install-binaryen.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-wasmopt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-wasmopt-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # Builds @simlin/engine (the wasm, optimized -- --require-opt fails the
      # job if build.sh skipped wasm-opt), @simlin/core, @simlin/diagram and
      # @simlin/notebook-widget, then stages the two assets plus ASSETS.json
      # (sizes, sha256s, source commit) into src/pysimlin/simlin/_widget/.
      - name: Build and stage widget assets
        run: python3 src/pysimlin/scripts/stage_widget_assets.py --require-opt

      - name: Upload widget assets
        uses: actions/upload-artifact@v4
        with:
          name: widget-assets
          path: |
            src/pysimlin/simlin/_widget/widget.js
            src/pysimlin/simlin/_widget/libsimlin-browser.wasm
            src/pysimlin/simlin/_widget/ASSETS.json
          if-no-files-found: error

  build-wheels:
    name: Build wheels
    needs: widget-assets
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - uses: actions/checkout@v4

      # The staged assets land where setup.py's package-data expects them;
      # the check re-verifies them (present, non-empty, hashes match the
      # manifest, wasm-opt'd) before any wheel is built, so a broken
      # artifact fails here rather than as a missing file in the wheel.
      - name: Download widget assets
        uses: actions/download-artifact@v4
        with:
          name: widget-assets
          path: src/pysimlin/simlin/_widget

      - name: Verify widget assets
        run: python3 src/pysimlin/scripts/stage_widget_assets.py --check --require-opt

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_LINUX: x86_64 aarch64
          CIBW_BEFORE_ALL: |
            # Install uv for fast dependency management
            curl -LsSf https://astral.sh/uv/install.sh | sh
          CIBW_BEFORE_BUILD: |
            set -ex  # Exit on error and print commands
            export PATH="$HOME/.local/bin:$PATH"
            uv pip install --system cffi setuptools wheel
            # Install Rust if needed
            if ! command -v cargo >/dev/null 2>&1; then
              echo "Installing Rust..."
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
            fi
            source "$HOME/.cargo/env" || true  # Ensure cargo is in PATH
            UNAME_S="$(uname -s)"; UNAME_M="$(uname -m)"
            if [ "$UNAME_S" = "Darwin" ] && [ "$UNAME_M" = "arm64" ]; then RUST_TARGET=aarch64-apple-darwin; fi
            if [ "$UNAME_S" = "Linux" ] && [ "$UNAME_M" = "x86_64" ]; then RUST_TARGET=x86_64-unknown-linux-gnu; fi
            if [ "$UNAME_S" = "Linux" ] && [ "$UNAME_M" = "aarch64" ]; then RUST_TARGET=aarch64-unknown-linux-gnu; fi
            echo "Adding Rust target: $RUST_TARGET"
            rustup target add "$RUST_TARGET"
            # Build in the project root to use workspace configuration
            echo "Building libsimlin..."
            cargo build --release --target "$RUST_TARGET" -p simlin
            # Copy library to where pysimlin expects it
            echo "Copying library..."
            mkdir -p src/libsimlin/target/release
            cp target/"$RUST_TARGET"/release/libsimlin.a src/libsimlin/target/release/
            ls -la src/libsimlin/target/release/  # Verify copy
        with:
          package-dir: src/pysimlin

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  test-wheels:
    name: Test wheels
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Install wheel and test dependencies
        run: |
          # Find the right wheel for this platform
          PYVER=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          if [ "$RUNNER_OS" = "Linux" ]; then
            PLATFORM="manylinux"
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then
              WHEEL=$(ls wheelhouse/pysimlin-*-${PYVER}-*-${PLATFORM}*_x86_64.whl 2>/dev/null | head -1)
            else
              WHEEL=$(ls wheelhouse/pysimlin-*-${PYVER}-*-${PLATFORM}*_aarch64.whl 2>/dev/null | head -1)
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # macOS ARM64
            WHEEL=$(ls wheelhouse/pysimlin-*-${PYVER}-*-macosx*_arm64.whl 2>/dev/null | head -1)
          fi

          if [ -z "$WHEEL" ]; then
            echo "No compatible wheel found for Python ${PYVER} on ${RUNNER_OS}"
            ls -la wheelhouse/
            exit 1
          fi

          echo "Installing wheel: $WHEEL"
          # The notebook extra: the asset probe below constructs a
          # ModelWidget and the test suite drives it (a bare wheel install
          # is covered by tests/test_widget_optional.py, which blocks the
          # import). The test extra brings pytest and friends; taking it from
          # the wheel's own metadata rather than re-pinning it here is what
          # keeps this job in step with pyproject when a test grows a new
          # dependency. Extras on a local wheel path: pip accepts
          # "path[extra]", so this spells them that way.
          uv pip install --system "${WHEEL}[notebook,test]"

          # Debug: Check if the module was installed correctly
          echo "Checking installed package..."
          uv pip show --system pysimlin
          python -c "import simlin; print('simlin imported successfully')" || {
            echo "Failed to import simlin. Checking what's installed:"
            python -c "import sys; print(sys.path)"
            python -c "import site; print(site.getsitepackages())"
            ls -la $(python -c "import site; print(site.getsitepackages()[0])")/pysimlin* || true
            exit 1
          }

      # AC4.1/AC4.4 of docs/design-plans/2026-08-17-pysimlin-widget.md: every
      # wheel carries widget.js + libsimlin-browser.wasm (+ ASSETS.json), the
      # assets are byte-identical across all platform wheels, and the
      # installed package (with the notebook extra) can construct a
      # ModelWidget. Both invocations exit non-zero on a wheel missing the
      # assets. The --installed probe runs from a directory that does not
      # contain src/pysimlin so `import simlin` resolves to the installed
      # wheel.
      - name: Check widget assets in the wheels
        run: |
          python src/pysimlin/scripts/check_wheel_assets.py --require-opt wheelhouse/*.whl
          mkdir -p /tmp/asset_probe
          cd /tmp/asset_probe
          python ${{ github.workspace }}/src/pysimlin/scripts/check_wheel_assets.py --installed --require-opt

      - name: Run tests
        run: |
          # Run tests from a temporary directory to ensure we're testing the installed wheel
          # not the source code
          mkdir -p /tmp/test_run
          cd /tmp/test_run
          # Copy test files and pysimlin README (needed by test_readme_examples.py)
          cp -r ${{ github.workspace }}/src/pysimlin/tests .
          cp ${{ github.workspace }}/src/pysimlin/README.md .
          # Run tests against installed package
          # SIMLIN_REPO_ROOT tells tests where to find model files from the main repo
          SIMLIN_REPO_ROOT=${{ github.workspace }} RUST_BACKTRACE=1 pytest -q tests/

  publish:
    name: Publish to PyPI
    needs: test-wheels
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheelhouse/
