name: Memory Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# `issues: write` is for the scheduled run alone, which has no author to tell
# that it failed and files an issue instead (scripts/ci-report-failure.sh).
permissions:
  contents: read
  issues: write

jobs:
  asan-pysimlin:
    name: AddressSanitizer Testing (pysimlin)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-21
          components: rust-src
          # Cache is enabled by default with actions-rust-lang/setup-rust-toolchain

      - name: Install dependencies
        run: |
          uv pip install --system cffi numpy pandas pytest pytest-cov

      - name: Build libsimlin with AddressSanitizer
        run: |
          cd src/libsimlin
          RUSTFLAGS="-Z sanitizer=address" \
          cargo +nightly-2026-02-21 build --release --target x86_64-unknown-linux-gnu
          # Copy the library to where pysimlin expects it
          mkdir -p target/release
          cp ../../target/x86_64-unknown-linux-gnu/release/libsimlin.a target/release/

      - name: Install pysimlin
        env:
          ASAN: '1'
        run: |
          cd src/pysimlin
          uv pip install --system -e .

      - name: Run memory tests with AddressSanitizer
        run: |
          cd src/pysimlin
          # Find the AddressSanitizer runtime library
          ASAN_LIB=$(gcc -print-file-name=libasan.so)
          
          # Run tests with verbose ASAN output and timeout. With halt_on_error=0
          # a leak here is a line in the log, not a failure: CPython's own
          # exit-time leaks would otherwise turn every run red.
          RUST_BACKTRACE=1 \
          ASAN_OPTIONS="detect_leaks=1:check_initialization_order=1:strict_init_order=1:verbosity=1:print_stats=1:halt_on_error=0:print_module_map=1:log_path=/tmp/asan.log" \
          LD_PRELOAD=$ASAN_LIB \
          PYTHONMALLOC=malloc \
          timeout 60 python -m pytest tests/test_memory.py -v --tb=short -x || EXIT_CODE=$?
          
          # Show ASAN log if it exists
          if [ -f /tmp/asan.log.* ]; then
            echo "=== ASAN Log ==="
            cat /tmp/asan.log.*
          fi
          
          # If specific test is failing, run it in isolation with more debug
          if [ "${EXIT_CODE:-0}" != "0" ]; then
            echo "=== Running failing test in isolation ==="
            RUST_BACKTRACE=full \
            ASAN_OPTIONS="detect_leaks=1:verbosity=1:halt_on_error=0" \
            LD_PRELOAD=$ASAN_LIB \
            PYTHONMALLOC=malloc \
            timeout 10 python -m pytest tests/test_memory.py::TestErrorPathMemoryLeaks::test_import_error_no_leak -vvs || true
          fi
          
          exit ${EXIT_CODE:-0}

      - name: Report a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-report-failure.sh "The scheduled AddressSanitizer run of pysimlin fails on main"

  asan-full:
    name: AddressSanitizer Testing (Full Rust Suite)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-21
          components: rust-src

      - name: Run ASAN tests
        run: ./test-asan.sh

      - name: Report a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-report-failure.sh "The scheduled AddressSanitizer run of the Rust suite fails on main" asan-test.log
