---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Every cargo cache below is keyed on Cargo.lock AND the workspace Cargo.toml.
# actions/cache only saves on a primary-key miss, so a key that ignored
# Cargo.toml froze the cache across a profile change (the cache kept serving
# artifacts of the old profile, and every run recompiled the new one from
# scratch until the next Cargo.lock bump); the restore-keys prefix still
# warms a rotated key from the previous cache.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Hosted runners occasionally lose DNS for crates.io mid-build; cargo's default of three
  # retries with short backoff has not been enough on the Windows smoke job.
  CARGO_NET_RETRY: 8

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # simlin-mcp's pysimlin_version_matches_latest_tag needs the
          # pysimlin-v* tags (setuptools-scm makes the tag the version's
          # source of truth); without them the guard skips on every run.
          fetch-tags: true

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-build-${{ matrix.os }}-

      - name: Compile
        run: cargo build --workspace --verbose

      - name: Compile tests
        run: cargo test --workspace --no-run

      # 3-minute wall-clock cap on `cargo test` (post-compile).  CI
      # baseline on ubuntu-latest is ~60s; the cap is a ~3x safety
      # rail against the kind of regression that made PR #461's job
      # hit GitHub's 60-minute per-job cap (one test binary there
      # took 44 minutes).  Uses the step-level `timeout-minutes`
      # field rather than coreutils `timeout(1)` so we do not need
      # to special-case macos-latest (which has no `timeout` on
      # PATH).  Raise in lockstep with scripts/pre-commit if the
      # suite legitimately grows past it.  See docs/dev/rust.md
      # for per-test budget guidance.
      - name: Test
        timeout-minutes: 3
        run: cargo test --workspace

  rust:
    name: Lint and format Rust
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-lint-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-lint-

      - name: Check formatting
        run: cargo fmt -- --check --color=auto

      - name: Lint with Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-llvm-cov-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-llvm-cov-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # cargo-llvm-cov needs the llvm-tools component for the pinned
      # toolchain. It is deliberately NOT in rust-toolchain.toml: every
      # other job (and every developer `rustup show`) would pay the
      # download for a component only this job uses.
      - name: Install llvm-tools
        run: rustup component add llvm-tools

      # Source-based LLVM coverage replaced cargo-tarpaulin's default
      # ptrace engine (GH #622, #726): ptrace instrumentation ran the
      # suite 5-50x slower than native, first blowing a 90-minute cap
      # and later violating timing assumptions in libsimlin's
      # concurrency tests. llvm-cov instrumentation runs tests at
      # near-native speed (native `cargo test --workspace` is ~60s
      # post-compile), so this cap is a generous backstop dominated by
      # the instrumented build: a warm-cache run fits comfortably in
      # 30 minutes, and the headroom above that absorbs the cold-cache
      # case (first run after a Cargo.lock change or cache eviction
      # rebuilds the whole instrumented workspace from scratch). Note
      # that unlike tarpaulin, llvm-cov has no per-test 60s
      # self-policing -- a runaway test eats the whole cap, and the
      # Build job's 3-minute test cap is the primary guard against
      # that.
      - name: Run cargo-llvm-cov
        timeout-minutes: 45
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-wasm-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-wasm-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install jupyterlab

      - name: Install pnpm dependencies
        run: pnpm install

      # eslint only disables prettier-conflicting rules via
      # eslint-config-prettier; this is the step that actually
      # enforces prettier formatting (mirrors scripts/pre-commit).
      - name: Check TypeScript formatting
        run: pnpm js-needs-format

      - name: Build the Typescript project
        run: DISABLE_WASM_OPT=1 pnpm build

      - name: Run TypeScript tests
        run: pnpm test

      # The production deploy is a local command with no CI gate, so
      # without this step a regression in the deploy assembly (build
      # outputs landing at the wrong path, hashed bundle not
      # referenced from index.html, web component bundle missing,
      # etc.) only surfaces during the actual `gcloud app deploy`.
      # This re-runs the deploy:assemble step against the existing
      # build, asserts the expected artifacts, and runs deploy:clean
      # so the workspace is restored before any subsequent steps.
      - name: Verify deploy build artifacts
        run: |
          pnpm --filter @simlin/app run deploy:assemble
          bash scripts/verify-deploy-build.sh
          pnpm --filter @simlin/app run deploy:clean
          # After deploy:clean the working tree should be clean. A
          # non-empty `git status` here means deploy:clean is missing
          # a path the build wrote into public/.
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "ERROR: deploy:clean left the working tree dirty:" >&2
            echo "$status" >&2
            exit 1
          fi

  pysimlin:
    name: pysimlin type check and tests
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-pysimlin-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-pysimlin-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build libsimlin
        run: cargo build --release --manifest-path src/libsimlin/Cargo.toml

      - name: Install pysimlin with dev dependencies
        working-directory: src/pysimlin
        run: |
          uv sync --extra dev
          uv pip install setuptools
          uv run python setup.py build_ext --inplace 2>/dev/null || true

      # ruff format --check enforces formatting (ruff check, run by the
      # pre-commit pysimlin script, is the linter only and does not).
      - name: Check formatting and lint with ruff
        working-directory: src/pysimlin
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check with mypy
        working-directory: src/pysimlin
        run: uv run mypy simlin/

      - name: Run tests
        working-directory: src/pysimlin
        run: uv run pytest -q --no-cov tests/

  pysimlin-e2e:
    name: pysimlin notebook editor journey (JupyterLab)
    runs-on: ubuntu-24.04
    # Dominated by builds (libsimlin release, the wasm32 engine, the diagram
    # and widget bundles); the journey itself runs in well under a minute.
    # A warm cargo cache brings the whole job to a few minutes; the headroom
    # is for a cold cache, which builds two engines from scratch.
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-pysimlin-e2e-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-pysimlin-e2e-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libsimlin
        run: cargo build --release --manifest-path src/libsimlin/Cargo.toml

      # The widget bundle and its workspace deps (@simlin/engine builds the
      # wasm32 engine, @simlin/core, @simlin/diagram) in topological order;
      # the widget's build ends by staging widget.js and the wasm into
      # src/pysimlin/simlin/_widget/ (scripts/stage_widget_assets.py).
      # DISABLE_WASM_OPT=1 marks a gate build: no multi-minute wasm-opt pass,
      # and the `wasm-gate` cargo profile (no LTO, parallel codegen) for the
      # engine. The journey exercises the widget's behaviour, not the
      # shipped blob's size or speed.
      - name: Build the notebook widget and stage its assets into pysimlin
        env:
          DISABLE_WASM_OPT: "1"
        run: pnpm --filter "@simlin/notebook-widget..." run build

      - name: Install pysimlin with the dev and e2e extras
        working-directory: src/pysimlin
        run: |
          uv sync --extra dev --extra e2e
          uv pip install setuptools
          uv run python setup.py build_ext --inplace

      # The version pinned by the root package.json's @playwright/test.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the JupyterLab journey
        run: make -C src/pysimlin e2e

      # The example notebook, executed headless in a real kernel (nbconvert
      # comes with jupyterlab), then exported to HTML twice: with the stored
      # widget state (the widget view + embedded state) and without it (the
      # SVG fallback static renderers show). The script-style run in
      # tests/test_examples.py cannot see the display path; this can.
      - name: Execute and export the example notebook headless
        run: make -C src/pysimlin export-check

      # Screenshots, the trace, and the jupyter server log are what a failed
      # journey needs to be understood.
      - name: Upload journey output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pysimlin-e2e-output
          path: src/pysimlin/e2e/.output/
          if-no-files-found: ignore

  policy:
    name: Policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check dependency policy
        run: python3 scripts/check-deps.py

      - name: Check documentation links
        run: python3 scripts/check-docs.py

      - name: Run project lint rules
        run: bash scripts/lint-project.sh

  # The embedded SPA is built ONCE, on ubuntu, and handed to the smoke legs
  # as an artifact. web/dist/ is platform-independent (wasm, JS, CSS), and
  # building it per leg cost every leg two wasm engine builds, which on the
  # 4-core macOS and Windows runners was 8 to 16 minutes by itself and pushed
  # the Windows leg past its cap (GH #1054).
  serve-web:
    name: simlin-serve embedded SPA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # Same key family as the frontend job: both build the same gate-profile
      # wasm engine into the same target directories, so they share one cache.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-wasm-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-wasm-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # `rsbuild build` only builds the @simlin/serve-web package; it
      # does NOT build its workspace dependencies. The pnpm `...` filter
      # selects serve-web AND its transitive deps (@simlin/core,
      # @simlin/engine, @simlin/diagram) in topological order so each
      # one's `lib/`/`lib.browser/`/`dist/` output exists before rsbuild
      # tries to resolve them. DISABLE_WASM_OPT=1 marks a gate build of
      # the engine package: no wasm-opt pass, and the `wasm-gate` cargo
      # profile (no LTO, parallel codegen; see the workspace Cargo.toml)
      # -- release-quality WASM is irrelevant for a smoke test of the
      # serve binary.
      - name: Build embedded SPA (with workspace deps)
        env:
          DISABLE_WASM_OPT: "1"
        run: pnpm --filter "@simlin/serve-web..." run build

      - name: Upload the SPA for the smoke legs
        uses: actions/upload-artifact@v4
        with:
          name: serve-web-dist
          path: src/simlin-serve/web/dist
          if-no-files-found: error
          retention-days: 1

  serve-smoke:
    name: simlin-serve smoke (${{ matrix.os }})
    needs: serve-web
    runs-on: ${{ matrix.os }}
    # One release compile of simlin-engine, simlin-mcp-core and simlin-serve
    # (fat LTO, the profile that ships) and then the smoke test itself, which
    # runs in well under a second. Warm-cache runs are 5 to 9 minutes; the
    # headroom is for a cold cache, which rebuilds the whole dependency
    # closure under LTO on a 4-core runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The platforms whose runtime behaviour the smoke test can exercise.
        # Windows is covered by serve-windows-check below: the smoke module
        # is compiled out there (tech-debt #38), so a Windows leg here would
        # spend a release LTO build on running zero tests. The @simlin/serve
        # npm matrix (serve-release.yml) additionally ships linux-arm64 and
        # win32-x64, both cross-compiled; neither is a GitHub-hosted runner
        # option, and linux-x64 covers the Linux runtime path.
        os: [ubuntu-latest, macos-latest]
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-serve-smoke-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-serve-smoke-${{ matrix.os }}-

      # Restored to the path build.rs and rust-embed read, so the binary the
      # test spawns embeds this SPA. The smoke test asserts the entry point is
      # actually served, which is what catches a missing or empty embed.
      - name: Download the embedded SPA
        uses: actions/download-artifact@v4
        with:
          name: serve-web-dist
          path: src/simlin-serve/web/dist

      # The smoke test lives in the consolidated `integration` harness;
      # `smoke::` filters to just its tests (all `#[ignore]`d, hence
      # `--ignored`). Cargo builds the `simlin-serve` binary the test spawns
      # (`CARGO_BIN_EXE_simlin-serve`) as part of this invocation, so there
      # is no separate build step. The run command is quoted because a plain
      # YAML scalar ending in `:` parses as a mapping key, which made the
      # whole workflow file invalid (every CI run since failed at startup
      # with zero jobs).
      - name: Run smoke test
        run: 'cargo test -p simlin-serve --release --test integration -- --ignored --nocapture smoke::'

  # simlin-serve's Windows-only code (the path resolution and watcher
  # branches under cfg(windows)) compiles nowhere else, and the smoke test is
  # compiled out on Windows (tech-debt #38), so this is a type-check of every
  # target rather than a release build that would run nothing. The shipped
  # win32-x64 binary is cross-compiled for the GNU target by
  # serve-release.yml; this job is what tells a PR that the crate no longer
  # builds on Windows at all.
  serve-windows-check:
    name: simlin-serve check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-serve-check-windows-latest-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-serve-check-windows-latest-

      - name: Type-check every simlin-serve target
        run: cargo check -p simlin-serve --all-targets
