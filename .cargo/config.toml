# Codegen settings for the WASM bundle, keyed on the target rather than passed
# by each build script so that every wasm build path -- the `cargo rustc
# --target wasm32-unknown-unknown` in src/engine/build.sh, any future wasm-pack
# invocation, etc. -- gets them automatically.
#
# The bundle takes `[profile.release]`'s `opt-level = 3` and `lto = true`
# (workspace Cargo.toml) rather than a size-optimized override. LTO reaches
# this target only because build.sh builds the bundle as a cdylib alone: cargo
# passes `-C lto` only when every crate type it is producing can be link-time
# optimized, and libsimlin's rlib cannot, so a plain `cargo build` of the crate
# gets opt-level 3 without LTO (the note in build.sh). Measured on C-LEARN v77
# through src/engine/bench/clearn-alloc.mjs (browser bundle after `wasm-opt
# -O3`, node 22 and 24, LTM on): against `opt-level = "z"` as `cargo build`
# produced it, without LTO for the same reason, the whole open-compile-run
# pipeline takes 0.59x to 0.62x the time (compile 0.50x to 0.57x, run 0.60x to
# 0.76x) for a bundle 1.8x larger raw (5.38 MB to 9.52 MB) and 1.5x larger
# compressed (brotli 1.27 MB to 1.87 MB, gzip 1.81 MB to 2.99 MB). `opt-level =
# "s"` sits between (without LTO: 0.72x to 0.77x the time, 6.56 MB raw, 1.47 MB
# brotli). Six hundred kilobytes more of compressed download is inside the
# variance of a page load; 1.6 seconds off a large model's open-compile-run is
# not.
#
# LTO itself, against the same opt-level 3 build without it: LLVM inlines the
# allocator's fast paths and simlin's own cross-crate calls, so the compile
# stage takes 0.91x to 0.94x the time and dispose 0.88x to 0.91x, while the
# run stage is within 1% on V8 12.4 and 5% faster on V8 13.6, for
# whole-pipeline totals of 0.94x to 0.96x; the browser bundle is 19% larger
# raw (8.03 MB to 9.52 MB) but only 6% larger brotli (1.76 MB to 1.87 MB),
# because the inlined copies are repetitive.
#
# `codegen-units=1` lives here and not in `[profile.release]` so that native
# release builds (CLI, server, MCP, pysimlin's libsimlin) keep their parallel
# codegen. Fat LTO merges every crate into one module, but each crate is still
# optimized per codegen unit before the merge, so the setting still matters:
# with it the shipped browser bundle is 5% smaller (10.03 MB to 9.52 MB raw,
# 1.92 MB to 1.87 MB brotli), the compile stage 2% to 3% faster, and the LTM
# run stage 17% to 19% faster on V8 13.6 (node 24) and within 3% either way on
# V8 12.4 (node 22), for whole-pipeline totals 1% to 3% better on node 22 and
# 10% to 11% better on node 24. Its price is build time: each of the two cargo
# builds in build.sh takes ~120 s instead of ~65 s on a 16-core desktop (a
# rebuild of both after touching simlin-engine ~240 s instead of ~130 s), and
# every wasm build pays it, the pre-commit hook and CI included. Deleting the
# flag buys that time back at the cost above.
#
# Caveat: a `RUSTFLAGS` *environment variable* takes precedence over and
# replaces these target rustflags (Cargo does not merge the two). Today only the
# asan test scripts set RUSTFLAGS, and they build for the host, so the wasm
# bundle is unaffected. Do not set RUSTFLAGS during a wasm release build or the
# bundle silently loses codegen-units=1.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "codegen-units=1"]
