[package]
name = "simlin-mcp"
version = "0.1.7"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "Apache-2.0"
edition = "2024"
description = "MCP server exposing the Simlin simulation engine"

[lib]
name = "simlin_mcp"
path = "src/lib.rs"

[[bin]]
name = "simlin-mcp"
path = "src/main.rs"

[dependencies]
simlin-mcp-core = { version = "0.1", path = "../simlin-mcp-core" }
# Without rmcp's defaults, which add chrono (unmaintained, RUSTSEC-2026-0543).
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
mimalloc = "0.1"
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }

[dev-dependencies]
simlin-base = { path = "../simlin-base" }
simlin-formats = { path = "../simlin-formats" }
tempfile = "3"
yaml-rust2 = { version = "0.13", default-features = false }
