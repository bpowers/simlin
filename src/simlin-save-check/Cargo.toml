[package]
name = "simlin-save-check"
version = "0.1.0"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "Apache-2.0"
edition = "2024"
description = "Whether saving a system dynamics project in a format keeps what it means"

[lib]
crate-type = ["rlib"]

[dependencies]
simlin-base = { path = "../simlin-base" }
simlin-engine = { path = "../simlin-engine", default-features = false }
simlin-formats = { path = "../simlin-formats", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
simlin-engine = { path = "../simlin-engine", default-features = false, features = ["test-support"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
