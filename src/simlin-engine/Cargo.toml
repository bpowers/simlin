[package]
name = "simlin-engine"
version = "0.1.0"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "Apache-2.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = ["ai_info"]
ai_info = ["dep:ed25519", "dep:base64"]
# Compiles in the `generate_loop_score_variables` loop-score tracing
# instrumentation (per-loop cumulative equation bytes + RSS sampling), a
# benchmarking/diagnostic aid only. Off by default so production builds carry
# no /proc/self/status read, env lookup, or eprintln! dead code. Enable with
# `--features ltm_bench` when running the `ltm_full_bench` example.
ltm_bench = []
# Compiles in `test_common` (the `TestProject` model builder) for OTHER crates'
# test targets. Every neighbour module in `src/lib.rs` is `#[cfg(test)]`, but
# `test_common` cannot be: libsimlin's and simlin-cli's tests build against this
# crate as an external dependency, where `cfg(test)` items do not exist. Left
# un-gated it shipped in every release build (GH #925). Consumers add it through
# a `[dev-dependencies]` edge, so a normal `cargo build` never sees it.
test-support = []
# The layout-quality eval statistics (`layout::eval_stats`). Its only consumer
# is simlin-tests' `layout_eval` example, whose `instruments` feature turns this
# on, so the 1,300-line module leaves every wasm/native production build. It is
# `cfg(any(test, ...))`, so its own tests run under a plain `cargo test`.
layout_eval = ["simlin-edit/invariants"]

[dependencies]
simlin-base = { path = "../simlin-base" }
simlin-diagram = { path = "../simlin-diagram" }
simlin-edit = { path = "../simlin-edit" }
simlin-formats = { path = "../simlin-formats", default-features = false }
smallvec = { version = "1", features = [ "union" ] }
ed25519 = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 0.28.5 is the floor: earlier 0.28 releases can free an interned value's
# storage while it is in use (RUSTSEC-2026-0308).
salsa = "0.28.5"
# Insertion-order-preserving map. Used for `LtmVariablesResult.loop_partitions`
# so the post-sim rel-loop-score denominator sums in the loops' emission order
# (bit-for-bit parity with the pre-#461 compile-time emitter; GH #468). Already
# in the dependency tree via salsa, which also provides its `salsa::Update` impl.
indexmap = "2"

rand = { version = "0.9", default-features = false, features = ["std_rng"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
simlin-base = { path = "../simlin-base", features = ["test-support"] }
simlin-diagram = { path = "../simlin-diagram", features = ["test-support"] }
simlin-edit = { path = "../simlin-edit", features = ["test-support"] }
simlin-formats = { path = "../simlin-formats", features = ["test-support", "file_io"] }
rand = "0.9"
# The tests read JSON floats exactly: without float_roundtrip, serde_json's fast
# parser can be off by one ULP. Dev-only: production builds of the crate keep
# the default fast parser.
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1.5"

# The integration tests, examples and benches of this crate are in simlin-tests.
