[package]
name = "simlin-diagram"
version = "0.1.0"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "Apache-2.0"
edition = "2024"
description = "Stock-and-flow diagrams drawn as SVG, PNG and a scene display list"

[lib]
crate-type = ["rlib"]

[features]
png_render = ["dep:resvg"]
# Compiles in the test helpers other crates' tests use. Consumers add it through
# a `[dev-dependencies]` edge, so a normal `cargo build` never sees it.
test-support = []

[dependencies]
simlin-base = { version = "0.1", path = "../simlin-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.50", optional = true, default-features = false, features = ["text"] }

[dev-dependencies]
simlin-engine = { path = "../simlin-engine", features = ["test-support"] }
