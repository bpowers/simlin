[package]
name = "simlin-tests"
version = "0.1.0"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "Apache-2.0"
edition = "2024"
publish = false

# The engine crates' black-box tests (one `tests/integration` harness and the
# allocation counter beside it), benchmarks and instruments. They are a package
# of their own because they use every crate at once: a crate's own unit tests
# cannot without depending on what is built on it. Nothing depends on this
# package, so all of its dependencies are dev-dependencies.

[features]
# The examples are instruments: programs that print a measurement or write a
# report for a person. Each lists this feature, so a plain `cargo test` links
# none of them and `cargo clippy --all-targets --all-features` still checks them
# all.
instruments = ["simlin-layout/layout_eval"]
# The Excel data provider, for the corpus models whose data is in a spreadsheet.
ext_data = ["simlin-formats/ext_data"]
# The loop-score tracing `ltm_full_bench` prints.
ltm_bench = ["simlin-engine/ltm_bench"]

[dev-dependencies]
# `file_io` is what makes the corpus tests run (`load_dat`, `load_csv`,
# `FilesystemDataProvider`). It is asked for here, where nothing can turn it
# off, and no test in this package is gated on a feature: a gate that is off
# compiles its test away without a word (GH #925).
simlin-base = { path = "../simlin-base" }
simlin-diagram = { path = "../simlin-diagram", features = ["png_render", "test-support"] }
simlin-edit = { path = "../simlin-edit" }
simlin-formats = { path = "../simlin-formats", features = ["file_io", "test-support"] }
simlin-layout = { path = "../simlin-layout" }
simlin-engine = { path = "../simlin-engine", features = ["test-support"] }
simlin-save-check = { path = "../simlin-save-check" }
simlin-wasmgen = { path = "../simlin-wasmgen" }
buffa = "0.9"
salsa = "0.28.5"
rayon = "1"
# The VDF parity harness (tests/integration/vdf_parity.rs) requires
# bitwise-exact f64 decoding of tools/vdf_xray.py's JSON output. Without
# float_roundtrip, serde_json's fast float parser can be off by one ULP,
# which reads as a phantom Rust-vs-Python divergence.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
# default features pull in the plotters HTML-report stack (plotters,
# criterion-plot, tinytemplate, cast, oorandom, ...); we only ever read the
# terminal summary, so trim to the bench-runner harness alone.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
csv = "1"
proptest = "1.5"
# To decode the PNGs the diagram tests render.
resvg = { version = "0.47", default-features = false }
tempfile = "3"
base64 = "0.22"
ed25519-dalek = "2"

# The wasm interpreter the wasmgen backend's output is run under, at the commit
# simlin-wasmgen pins.
wasm-interpreter = { git = "https://github.com/DLR-FT/wasm-interpreter.git", rev = "64cedbba603edfd64cbb6b5a19f5fa34530bb03a" }
checked = { git = "https://github.com/DLR-FT/wasm-interpreter.git", rev = "64cedbba603edfd64cbb6b5a19f5fa34530bb03a", features = ["linker", "interop"] }

