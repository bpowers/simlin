[package]
name = "simlin-serve"
version = "0.1.0"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "Apache-2.0"
edition = "2024"
description = "Local HTTP server for browsing and editing system-dynamics models"

[lib]
name = "simlin_serve"
path = "src/lib.rs"

[features]
# Exposes `test_support` (integration-test fixtures: the watcher-readiness
# probe helpers and the git-unavailable probe). Off by default so the
# fixtures are not compiled into the shipped `simlin-serve` binary; the
# self dev-dependency below turns it on for this crate's own test targets.
test-support = []

[[bin]]
name = "simlin-serve"
path = "src/main.rs"

[dependencies]
mimalloc = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
simlin-engine = { version = "0.1", path = "../simlin-engine", features = ["schema"] }
simlin-mcp-core = { version = "0.1", path = "../simlin-mcp-core" }
rmcp = { version = "1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["preserve_order"] }
rust-embed = "8"
anyhow = "1"
loro = "1"
notify-debouncer-full = "0.7"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64", "std"] }

[build-dependencies]
anyhow = "1"

[dev-dependencies]
# Self dev-dependency so `tests/` can reach the feature-gated `test_support`
# module without the feature leaking into a normal build of the library or
# the binary.
simlin-serve = { path = ".", features = ["test-support"] }
# `parity_create` compares this crate's create path against the shared
# core's, which means reaching for that crate's own gated fixtures.
simlin-mcp-core = { version = "0.1", path = "../simlin-mcp-core", features = [
  "test-support",
] }
tower = "0.5"
tempfile = "3"
serde_yaml = "0.9"
tokio-tungstenite = "0.29"
futures-util = "0.3"
rmcp = { version = "1", features = ["server", "macros", "schemars", "transport-streamable-http-server", "client", "transport-async-rw"] }
# The smoke test's HTTP client is a thin helper over the hyper legacy
# connection pool: it only speaks plaintext HTTP/1.1 to a loopback
# listener, so a full-featured client (and its TLS closure) is
# deliberately avoided.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "http1", "client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"
