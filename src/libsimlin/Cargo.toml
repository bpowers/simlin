[package]
name = "simlin"
version = "0.1.0"
description = "C-compatible FFI interface to the System Dynamics engine"
repository = "https://github.com/bpowers/simlin"
authors = ["Bobby Powers <bobbypowers@gmail.com>"]
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[features]
# png_render is on by default for native consumers (pysimlin via cffi, CGo,
# C/C++) -- the server's model-preview pipeline rasterizes diagrams to PNG.
# The browser wasm bundle disables it (src/engine/build.sh passes
# --no-default-features for the browser artifact): the resvg + text-shaping
# stack plus an embedded font is ~28% of the optimized wasm binary, and no
# browser code calls simlin_project_render_png.
default = ["png_render"]
debug-derive = ["simlin-engine/debug-derive"]
file_io = ["simlin-engine/file_io"]
ext_data = ["simlin-engine/ext_data"]
png_render = ["simlin-engine/png_render"]
# Use mimalloc as the global allocator. Off by default; enabled by native
# consumers of the cdylib/staticlib (pysimlin via cffi, C/C++ FFI) where the
# allocation-heavy engine compile path benefits. Irrelevant to the wasm32
# bundle, which always uses wasmalloc (the target-specific dependency below):
# lib.rs cfg's the mimalloc global_allocator off for wasm32, so enabling this
# feature there cannot declare a second global allocator.
mimalloc = ["dep:mimalloc"]

[dependencies]
simlin-engine = { version = "0.1", path = "../simlin-engine", default-features = false }
prost = "0.14"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
mimalloc = { version = "0.1", optional = true }

# The wasm32 bundle's global allocator (see the `#[global_allocator]` in
# lib.rs). Pure Rust and no_std, so it adds no build tooling; single-threaded,
# which every artifact src/engine/build.sh produces is.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasmalloc = "0.1.1"

[dev-dependencies]
# Second edge onto the engine, adding EXACTLY `test-support` (the `TestProject`
# model builder its integration tests use as `engine::test_common`). Keeping it
# in dev-dependencies is what stops that builder from being compiled into the
# shipped cdylib/staticlib; `default-features = false` mirrors the normal edge
# above, since feature selection is a union over every edge and a defaults edge
# here would silently re-enable them for test builds.
simlin-engine = { version = "0.1", path = "../simlin-engine", default-features = false, features = ["test-support"] }
# Pure-Rust no_std wasm interpreter (the same DLR-FT rev simlin-engine pins),
# used by the `tests/integration/wasm.rs` integration test to validate and execute the blob
# `simlin_model_compile_to_wasm` returns and check it against the returned
# layout. Dev-only: dev-dependencies are never built into the cdylib/staticlib
# or the wasm32 bundle (which uses --no-default-features), so this cannot leak
# into the shipped library.
wasm-interpreter = { git = "https://github.com/DLR-FT/wasm-interpreter.git", rev = "64cedbba603edfd64cbb6b5a19f5fa34530bb03a" }
checked = { git = "https://github.com/DLR-FT/wasm-interpreter.git", rev = "64cedbba603edfd64cbb6b5a19f5fa34530bb03a", features = ["linker", "interop"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
