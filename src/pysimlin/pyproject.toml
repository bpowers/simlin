[build-system]
# setuptools >= 70.1 ships bdist_wheel itself, which setup.py subclasses to
# guard the widget assets (no separate `wheel` requirement).
requires = ["setuptools>=70.1", "cffi>=1.15.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysimlin"
dynamic = ["version"]
description = "Python bindings for the Simlin system dynamics simulation engine"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "The Simlin Authors"},
]
maintainers = [
    {name = "The Simlin Authors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "cffi>=1.15.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    # client environments need cattrs 23.1; we only use hand-registered
    # hooks on cattrs.Converter, verified against 23.1.0 through 25.3.0
    "cattrs>=23",
    # The notebook editor widget (simlin.widget.ModelWidget) is part of the
    # core package, not an extra: pip install pysimlin must be enough to
    # display a model in a notebook cell.
    "anywidget>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.100.0",
    "jsonschema>=4.20.0",
]
dev = [
    "pysimlin[test]",
    "mypy>=1.5.0",
    "ruff>=0.8.0",
    "pandas-stubs>=2.0.0",
    "types-cffi>=1.16.0",
    "types-setuptools",
    "build>=1.0.0",
    # setup.py's packaging guard is exercised directly by the test suite.
    "setuptools>=70.1",
]
# Everything the repo-level notebooks/ build scripts need on top of dev:
# building and executing the .ipynb (nbformat/nbclient/ipykernel), rendering
# HTML (nbconvert), and the plotting/imaging the notebook cells use. Declared
# here so a plain `uv sync` doesn't prune them out of the shared venv.
notebooks = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/bpowers/simlin"
Documentation = "https://github.com/bpowers/simlin/tree/main/src/pysimlin"
Repository = "https://github.com/bpowers/simlin"
Issues = "https://github.com/bpowers/simlin/issues"

[tool.setuptools]
packages = ["simlin"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
# _widget/ holds the notebook widget's JS module and engine wasm (build
# outputs of src/notebook-widget staged by scripts/stage_widget_assets.py,
# which also writes ASSETS.json; see simlin/_widget/README.md).
simlin = [
    "py.typed",
    "*.pyi",
    "_widget/*.js",
    "_widget/*.wasm",
    "_widget/ASSETS.json",
    "_widget/README.md",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
]
ignore = [
    "UP007",  # Use X | Y for union types -- we use this deliberately in some places
]

[tool.ruff.lint.per-file-ignores]
# C declaration strings have long lines that cannot be wrapped
"simlin/_ffi_build.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--verbose --cov=simlin --cov-report=term-missing"

[tool.coverage.run]
source = ["simlin"]
omit = ["*/tests/*", "*/_ffi_build.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.setuptools_scm]
root = "../.."
tag_regex = "^pysimlin-v(?P<version>.+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "pysimlin-v*"]
