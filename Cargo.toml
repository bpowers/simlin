[workspace]

resolver = "2"
members = [
    "src/libsimlin",
    "src/simlin-cli",
    "src/simlin-engine",
    "src/simlin-mcp",
    "src/simlin-mcp-core",
    "src/simlin-serve",
    "src/xmutil",
]

# Native release builds optimize for speed (opt-level = 3). The WASM bundle,
# where download size dominates, is forced back to opt-level = "z" via
# `.cargo/config.toml` ([target.wasm32-unknown-unknown] rustflags), which is
# keyed on the target rather than the build invocation so every wasm build path
# stays size-optimized. Measured on C-LEARN: opt-level 3 vs "z" is ~-30% compile
# and ~-41% simulate on native (see docs/design/engine-performance.md).
[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

[profile.bench]
debug = true
strip = false

# Optimize a few hot DEPENDENCIES in dev/test builds. Workspace crates stay at
# opt-level 0 (fast incremental rebuilds); these are external crates that
# rarely recompile but sit on test-suite critical paths, where debug-build
# slowdown is 10-30x:
#   - serde_json: the VDF parity harness decodes a multi-megabyte
#     --extract-json payload (with float_roundtrip) on every `cargo test`.
#   - wasm-interpreter/checked: every wasmgen parity test executes an emitted
#     blob under this pure-Rust interpreter.
[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.wasm-interpreter]
opt-level = 3

[profile.dev.package.checked]
opt-level = 3
