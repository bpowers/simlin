[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # DLR-FT/wasm-interpreter backs the engine's WebAssembly simulation
    # backend (#620). Used unreleased and pinned by `rev`; there is no
    # crates.io release yet, so it is referenced directly from git.
    "https://github.com/DLR-FT/wasm-interpreter.git",
]
