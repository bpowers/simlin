[advisories]
yanked = "deny"
ignore = [
    # atomic-polyfill is unmaintained (the README points to portable-atomic
    # as a replacement). It's a transitive dep we don't control:
    # loro -> loro-internal -> postcard -> heapless -> atomic-polyfill.
    # Heapless 0.7 is what postcard 1.x pins; postcard 2.x drops the
    # dependency, but loro hasn't bumped postcard yet. Ignoring rather than
    # pinning ourselves because the only fix is upstream-driven.
    "RUSTSEC-2023-0089",
    # ttf-parser is unmaintained (the author declared it so; see
    # harfbuzz/ttf-parser#217). It's a transitive dep of our SVG-to-PNG render
    # stack we don't control: resvg -> usvg -> {fontdb, rustybuzz} -> ttf-parser.
    # The advisory states "No safe upgrade is available", and resvg/usvg have
    # not migrated off it, so the only fix is upstream-driven. No code-execution
    # or memory-safety risk -- it is purely a maintenance-status advisory.
    "RUSTSEC-2026-0192",
    # rustybuzz is unmaintained (the maintainer declared it so; see
    # harfbuzz/rustybuzz#166, which names harfrust as the successor). Same
    # SVG-to-PNG render stack as RUSTSEC-2026-0192 above, one level up:
    # resvg -> usvg -> rustybuzz. We are on the latest resvg (0.47.0), which
    # still shapes text with rustybuzz; the migration to harfrust is upstream
    # (resvg) work, so the only fix is upstream-driven. Like the ttf-parser
    # entry, purely a maintenance-status advisory -- no code-execution or
    # memory-safety risk.
    "RUSTSEC-2026-0206",
    # bitmaps, im and sized-chunks are unmaintained -- one author's cluster,
    # all three declared at once, all reached through the same single edge:
    # simlin-serve -> loro -> loro-internal -> im -> {bitmaps, sized-chunks}.
    # Each advisory states "No safe upgrade is available"; im's own
    # announcement points at the imbl fork, which is loro's migration to make,
    # not ours. Purely maintenance-status advisories -- no code-execution or
    # memory-safety claim in any of the three.
    #
    # Revisit when loro drops im (watch loro-internal's dependency on it): all
    # three go together, because bitmaps and sized-chunks are only here as im's
    # dependencies.
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0248",
    "RUSTSEC-2026-0251",
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License: permissive, OSI-approved, used by xxhash-rust
    # (transitive via loro/loro-internal for stable hashing).
    "BSL-1.0",
    # Creative Commons CC0 (public-domain dedication): notify 8.x.
    "CC0-1.0",
    # ISC: BSD-style permissive, used by inotify / inotify-sys
    # (transitive via notify-debouncer-full -> notify on Linux).
    "ISC",
    "MIT",
    # Mozilla Public License 2.0: file-level copyleft, OSI-approved.
    # Brought in by loro -> im (and im's bitmaps / sized-chunks helpers).
    # File-level copyleft means we just need to redistribute MPL-licensed
    # source files unchanged, which is automatic for us since they ship
    # via crates.io. We don't depend on portable-atomic / heapless feature
    # combinations that would pull in the GPL-licensed variant.
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# Override the declared SPDX expression for crates that publish the
# non-standard `MPL-2.0+` shorthand. `+` is a valid SPDX modifier in
# *expressions* but cargo-deny rejects it in the flat allow list,
# whereas the only later-than-2.0 MPL hasn't been published. These
# crates are functionally MPL-2.0; the clarification just normalises
# the string.
[[licenses.clarify]]
crate = "bitmaps"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "im"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "sized-chunks"
expression = "MPL-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/bpowers/test-generator",
    # DLR-FT/wasm-interpreter backs the engine's WebAssembly simulation
    # backend (#620). Used unreleased and pinned by `rev`; there is no
    # crates.io release yet, so it is referenced directly from git.
    "https://github.com/DLR-FT/wasm-interpreter.git",
]
